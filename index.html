<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WR Smile & Supplies - Premium Shopping</title>
    <link rel="icon" type="image/png" href="https://ui-avatars.com/api/?name=WR&background=7c3aed&color=fff&size=128&bold=true" />
    <meta property="og:image" content="https://ui-avatars.com/api/?name=WR&background=7c3aed&color=fff&size=128&bold=true" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased text-gray-800 dark:text-gray-100 min-h-screen relative overflow-x-hidden selection:bg-purple-300 selection:text-purple-900">
    
    <!-- Premium Liquid Background -->
    <div class="liquid-background">
        <!-- Abstract Shapes -->
        <div class="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] rounded-full bg-purple-300/30 dark:bg-purple-600/20 blur-[100px] animate-blob mix-blend-multiply dark:mix-blend-screen filter"></div>
        <div class="absolute top-[0%] right-[-10%] w-[35vw] h-[35vw] rounded-full bg-cyan-200/30 dark:bg-cyan-600/20 blur-[100px] animate-blob animation-delay-2000 mix-blend-multiply dark:mix-blend-screen filter"></div>
        <div class="absolute bottom-[-10%] left-[20%] w-[45vw] h-[45vw] rounded-full bg-pink-300/30 dark:bg-pink-600/20 blur-[100px] animate-blob animation-delay-4000 mix-blend-multiply dark:mix-blend-screen filter"></div>
        <div class="absolute bottom-[10%] right-[10%] w-[30vw] h-[30vw] rounded-full bg-yellow-200/30 dark:bg-amber-600/20 blur-[80px] animate-blob animation-delay-2000 mix-blend-multiply dark:mix-blend-screen filter"></div>
        
        <!-- Center connecting blob -->
        <div class="absolute top-[30%] left-[30%] w-[40vw] h-[40vw] rounded-full bg-indigo-300/20 dark:bg-indigo-600/20 blur-[120px] animate-pulse-slow mix-blend-multiply dark:mix-blend-screen filter"></div>
        
        <!-- Noise Texture -->
        <div class="noise-overlay"></div>
    </div>

    <div id="root"></div>
    
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
